  <title>開始測試 · 識講粵語</title>

<body>
  <main class="container">
    <section class="section">
      <div id="quiz-container"></div>
    </section>
  </main>

  <script src="js/common.js?v=20260607b"></script>
  <script src="js/quiz.js?v=20260607b"></script>
  <script>
    (async function () {
      // 1. 立即显示 loading 状态，避免空白页
      const container = document.getElementById('quiz-container');
      const T0 = Cantonese.t || (k => k);
      container.innerHTML = '<div class="center mt-3"><p class="muted">' + T0('test.loading') + '</p></div>';

      // 2. 加载 i18n（重试 2 次，应对网络抖动；检测实际是否加载成功）
      let i18nOk = false;
      for (let attempt = 0; attempt < 3 && !i18nOk; attempt++) {
        try {
          await Cantonese.applyI18n();
          // applyI18n 内部 try/catch 吞错，调用后必须检测 I18N 是否真加载
          if (Cantonese.t('test.lv-test') !== 'test.lv-test') {
            i18nOk = true;
          } else {
            console.warn('[test] i18n load returned but I18N missing, attempt ' + (attempt + 1));
          }
        } catch (e) {
          console.warn('[test] i18n load fail, attempt ' + (attempt + 1), e);
        }
        if (!i18nOk) await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
      }
      if (!i18nOk) {
        container.innerHTML = '<div class="center mt-3"><p style="color: var(--pink);">' +
          Cantonese.t('result.error-title') + '</p><p class="text-sm muted">' +
          Cantonese.t('result.error-cta') + ' · <button class="btn btn-ghost" onclick="location.reload()">↻</button></p></div>';
        return;
      }

      Cantonese.initTheme();
      Cantonese.injectThemeToggle();
      Cantonese.injectTopbar('test');
      Cantonese.initIcons();
      Cantonese.initScrollReveal();

      // 捕獲邀請碼
      const refParam = Cantonese.getQuery('ref');
      if (refParam && refParam !== 'reminder' && /^[A-Z0-9]{4,12}$/.test(refParam)) {
        Cantonese.Store.set('cantonese_referred_by', refParam);
      }

      // 已測過 → 直接跳到結果頁
      const existing = Cantonese.Store.get(Cantonese.Store.KEYS.result);
      const isRestart = Cantonese.getQuery('restart') === '1';
      const isReminder = Cantonese.getQuery('ref') === 'reminder';
      if (existing && existing.level && !isRestart && !isReminder) {
        location.href = 'result.html';
      } else {
        try {
          await Quiz.init(container);
        } catch (e) {
          console.error('[test] Quiz.init fail', e);
          // 关键：catch 不能崩。用硬编码 fallback，且 t() 失败时也兜底
          let errorTitle = 'Something went wrong';
          let errorCta = '↻ Reset & Retry';
          let errMsg = (e && e.message) || String(e);
          try { errorTitle = Cantonese.t('result.error-title') || errorTitle; } catch (_) {}
          try { errorCta = Cantonese.t('result.error-cta') || errorCta; } catch (_) {}
          try {
            container.innerHTML = '<div class="center mt-3"><p style="color: var(--pink);">' +
              errorTitle + '</p><p class="text-sm muted" style="margin: 8px 0; font-family: monospace; font-size: 12px;">' + errMsg + '</p>' +
              '<button class="btn btn-primary" onclick="localStorage.removeItem(\'cantonese_quiz\'); location.reload();">' + errorCta + '</button></p></div>';
          } catch (e2) {
            console.error('[test] catch failed', e2);
            container.textContent = errorTitle + ' — ' + errMsg;
          }
        }
      }
    })();
  </script>
</body>
