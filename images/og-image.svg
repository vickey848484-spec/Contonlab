<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066ff"/>
      <stop offset="100%" style="stop-color:#ff3366"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 左右品牌色条 -->
  <rect x="0" y="0" width="10" height="630" fill="#0066ff"/>
  <rect x="1190" y="0" width="10" height="630" fill="#ffd60a"/>

  <!-- 顶部 LOGO 区 -->
  <text x="80" y="90" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="32" font-weight="700" fill="#ffd60a" letter-spacing="2">識講粵語 · YUE TEST</text>
  <text x="1120" y="90" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="end">@包媽VK教粵語</text>

  <!-- 顶部黄色徽章 -->
  <rect x="500" y="130" width="200" height="56" fill="#ffd60a" rx="28"/>
  <text x="600" y="170" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#0a0a0a" text-anchor="middle" letter-spacing="4">免費測試</text>

  <!-- 主標題 -->
  <text x="80" y="290" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="72" font-weight="900" fill="#fff" letter-spacing="-1">3 分鐘測出你的</text>
  <text x="80" y="380" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="100" font-weight="900" fill="#ffd60a" letter-spacing="-1">粵語等級</text>
  <text x="80" y="460" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="40" font-weight="700" fill="#fff">+ MBTI 風格人格 · 學習時長</text>

  <!-- 底部信息条 -->
  <rect x="0" y="540" width="1200" height="90" fill="url(#accent)" opacity="0.15"/>
  <text x="80" y="580" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#fff">9 聲 6 調 · 25 萬+ 粉絲 · 16+ 年教學</text>
  <text x="80" y="610" font-family="-apple-system, sans-serif" font-size="20" font-weight="500" fill="#999">canton-ai.com · by Vickey 老師</text>

  <!-- 右侧装饰圆 -->
  <circle cx="1080" cy="310" r="60" fill="none" stroke="#ffd60a" stroke-width="4" opacity="0.4"/>
  <circle cx="1080" cy="310" r="40" fill="none" stroke="#0066ff" stroke-width="3" opacity="0.5"/>
  <circle cx="1080" cy="310" r="20" fill="#ffd60a" opacity="0.6"/>
</svg>
